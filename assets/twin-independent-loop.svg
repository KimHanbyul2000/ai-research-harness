<?xml version="1.0" encoding="UTF-8"?>
<!--
  Twin Independent Loop: 구조 개념도

  신청서 첨부 이미지(AI 생성 PNG)를 같은 구도로 다시 그린 것이다.
    · 구조만 담는다. 값이 없으므로 .png 가 아니라 .svg 다 (docs/포맷별_역할.md)
    · 두 루프는 서로 다른 범주라 색 두 개를 쓴다. 나머지는 회색조
    · 글자색은 CSS 클래스에서만 정한다. 클래스의 fill 이 presentation attribute 를 이긴다
    · 이 주석 안에 하이픈을 두 개 연달아 쓰지 않는다 (오답노트 패턴 2)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700"
     font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"
     role="img" aria-label="Twin Independent Loop 구조 개념도">

  <title>Twin Independent Loop — Human-in-the-Loop AI 연구 협업 체계</title>
  <desc>문서 에이전트 루프와 코드 에이전트 루프가 서로 다른 디렉토리에서 돌고, 가운데의 연구자가 방향을 정하고 승인한다.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#6b6b6b"/>
    </marker>
    <style>
      .ttl   { font-size:30px; font-weight:800; fill:#1a1a1a; }
      .sub   { font-size:15px; fill:#6b6b6b; }
      .ring1 { fill:none; stroke:#4a5566; stroke-width:40; }
      .ring2 { fill:none; stroke:#d9735f; stroke-width:40; }
      .core  { fill:#ffffff; stroke:#b9b9b9; stroke-width:14; }
      .kick  { font-size:13px; font-weight:700; letter-spacing:.12em; fill:#8a8a8a; }
      .name  { font-size:25px; font-weight:800; fill:#1a1a1a; }
      .role  { font-size:14.5px; fill:#4a4a4a; }
      .tag1  { fill:#eef0f3; stroke:#4a5566; stroke-width:1.2; }
      .tag2  { fill:#fbefec; stroke:#d9735f; stroke-width:1.2; }
      .tagt  { font-size:13px; font-weight:700; fill:#1a1a1a; }
      .who   { font-size:28px; font-weight:800; fill:#1a1a1a; }
      .whos  { font-size:14px; fill:#4a4a4a; }
      .gate  { font-size:13px; font-weight:700; fill:#ffffff; }
      .gdot  { fill:#1a1a1a; }
      .flow  { stroke:#6b6b6b; stroke-width:1.6; fill:none; }
      .flowt { font-size:13.5px; fill:#4a4a4a; }
      .hd    { font-size:17px; font-weight:800; fill:#1a1a1a; }
      .tx    { font-size:13.5px; fill:#5a5a5a; }
      .rule  { stroke:#e0e0e0; stroke-width:1; }
      .cap   { font-size:13.5px; fill:#6b6b6b; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>

  <text x="600" y="52" class="ttl" text-anchor="middle">Twin Independent Loop</text>
  <text x="600" y="80" class="sub" text-anchor="middle">Human-in-the-Loop AI 연구 협업 체계 · 두 루프는 서로 다른 디렉토리에서 돌고, 판단은 가운데에 남는다</text>

  <!-- ───────── 두 루프 ───────── -->
  <circle cx="330" cy="380" r="180" class="ring1"/>
  <circle cx="870" cy="380" r="180" class="ring2"/>

  <!-- Loop 1 안쪽 -->
  <g transform="translate(318,318)">
    <text x="0" y="0" class="kick" text-anchor="middle">LOOP 1</text>
    <text x="0" y="34" class="name" text-anchor="middle">문서 에이전트</text>
    <text x="0" y="60" class="role" text-anchor="middle">연구 목표 · 논문 · 용어 · 해석</text>
    <rect x="-88" y="82" width="84" height="28" rx="14" class="tag1"/>
    <text x="-46" y="101" class="tagt" text-anchor="middle">용어 장부</text>
    <rect x="4" y="82" width="84" height="28" rx="14" class="tag1"/>
    <text x="46" y="101" class="tagt" text-anchor="middle">.md</text>
  </g>

  <!-- Loop 2 안쪽 -->
  <g transform="translate(882,318)">
    <text x="0" y="0" class="kick" text-anchor="middle">LOOP 2</text>
    <text x="0" y="34" class="name" text-anchor="middle">코드 에이전트</text>
    <text x="0" y="60" class="role" text-anchor="middle">코드 · 실행 · 데이터 분석 · 시각화</text>
    <rect x="-104" y="82" width="100" height="28" rx="14" class="tag2"/>
    <text x="-54" y="101" class="tagt" text-anchor="middle">포맷별 역할</text>
    <rect x="4" y="82" width="100" height="28" rx="14" class="tag2"/>
    <text x="54" y="101" class="tagt" text-anchor="middle">오답노트</text>
  </g>

  <!-- ───────── 가운데: 연구자 ───────── -->
  <circle cx="600" cy="380" r="118" class="core"/>
  <text x="600" y="342" class="who" text-anchor="middle">연구자</text>
  <text x="600" y="370" class="whos" text-anchor="middle">무엇을 · 왜 · 승인</text>
  <text x="600" y="391" class="whos" text-anchor="middle">최종 결정권은 넘기지 않는다</text>
  <g transform="translate(600,428)">
    <circle cx="-45" cy="0" r="12" class="gdot"/><text x="-45" y="5" class="gate" text-anchor="middle">1</text>
    <circle cx="-15" cy="0" r="12" class="gdot"/><text x="-15" y="5" class="gate" text-anchor="middle">2</text>
    <circle cx="15"  cy="0" r="12" class="gdot"/><text x="15"  y="5" class="gate" text-anchor="middle">3</text>
    <circle cx="45"  cy="0" r="12" class="gdot"/><text x="45"  y="5" class="gate" text-anchor="middle">4</text>
  </g>
  <text x="600" y="462" class="whos" text-anchor="middle">승인 게이트</text>

  <!-- ───────── 루프 사이의 흐름 ───────── -->
  <path class="flow" d="M490,236 H710" marker-end="url(#arw)"/>
  <text x="600" y="224" class="flowt" text-anchor="middle">그 연구에 필요한 맥락만 넘긴다</text>
  <path class="flow" d="M710,526 H490" marker-end="url(#arw)"/>
  <text x="600" y="550" class="flowt" text-anchor="middle">결과와 해석을 문서로 회수한다</text>

  <!-- ───────── 네 모서리 설명 ───────── -->
  <text x="40" y="128" class="hd">연구 목적 정의</text>
  <text x="40" y="150" class="tx">논문과 배경에서 목적과 근거를 정리한다.</text>
  <text x="40" y="169" class="tx">설계목표가 코드보다 먼저 존재한다.</text>

  <text x="40" y="606" class="hd">1차 출처로 근거 검증</text>
  <text x="40" y="628" class="tx">원문과 대조해 확인된 것만 쌓는다.</text>
  <text x="40" y="647" class="tx">용어는 장부와 대조한 뒤 확정한다.</text>

  <text x="1160" y="128" class="hd" text-anchor="end">분석 폴더 단위로 격리 실행</text>
  <text x="1160" y="150" class="tx" text-anchor="end">분석 하나 = 폴더 하나.</text>
  <text x="1160" y="169" class="tx" text-anchor="end">설계목표 · run.py · 결과해석을 함께 둔다.</text>

  <text x="1160" y="606" class="hd" text-anchor="end">시각화 검증과 오답노트</text>
  <text x="1160" y="628" class="tx" text-anchor="end">.html 로 탐색하고, 승인된 것만 .png 로 확정한다.</text>
  <text x="1160" y="647" class="tx" text-anchor="end">반복된 오류는 규칙 한 줄로 쌓는다.</text>

  <line x1="40" y1="672" x2="1160" y2="672" class="rule"/>
  <text x="600" y="693" class="cap" text-anchor="middle">구조만 담은 개념도다. 값은 담지 않는다.</text>
</svg>
